[project]
name = "auto-domain-kg"
version = "0.1.0"
description = "Multi-agent knowledge graph construction framework with GAN-style architecture"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "async: mark test as async",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auto_domain_kg"]